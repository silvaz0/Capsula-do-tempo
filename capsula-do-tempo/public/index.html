<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capsula do Tempo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <h1>Capsula do Tempo da Turma</h1>
        <p>Escreva hoje, veja no futuro</p>
    </header>
    
    <main class="conteudo">
        <section class="cartao">
            <h2>Enterrar uma nova cápsula</h2>
            <form id="form-capsula">
                <label for="autor">Seu Nome:</label>
                <input type="text" id="autor" maxlength="60" required placeholder="Escreva aqui">

                <label for="titulo">Título:</label>
                <input type text="text" id="titulo" maxlength="100" required placeholder="Escreva aqui">

                <label for="mensagem">Mensagem para o futuro:</label>
                <textarea id="mensagem" row="5" maxlength="1000" required placeholder="Escreva sua mensagem"></textarea>

                <label for="abre_em">Abrir em:</label>
                <input type="datetime-local" id="abre_em" required>
                
                <button type="submit">Trancar a cápsula</button>
                <p id="aviso" class="aviso"></p>
            </form>
        </section>
        <section>
            <h2>Cápsulas da turma</h2>
            <div id="lista">
                <article class="capsula trancada">
                    <h3>Para mim em 2030</h3>
                    <small>Por Erick</small>
                    <p class="contagem">Abre em 1234 dias</p>
                </article>
                <article class="capsula aberta">
                    <h3>Bem-Vindos!</h3>
                    <small>Por Aluno</small>
                    <p>Esta página já foi aberta. Esta é a mensagem dela.</p>
                </article>
            </div>
        </section>
    </main>
    
</body>
</html>
